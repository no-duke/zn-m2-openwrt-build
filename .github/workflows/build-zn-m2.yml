name: Build-ZN-M2-OpenClash

# ============================================================================
# 兆能 M2 (ZN M2) —— IPQ6000 —— 云编译
# 产物：无 WiFi + 有线 NSS + OpenClash + HomeProxy 的 OpenWrt 固件
# ----------------------------------------------------------------------------
# 源码：LiBwrt/LibWrt  分支 25.12-nss   （6.12 内核 + 满血 NSS 支持）
#
# ★ 重要修正（相对上游 breeze303/openwrt-ci）：
#   上游写的是 REPO_BRANCH: main-nss，但该分支已不存在。
#   LiBwrt/LibWrt 当前只有 25.12-nss 一个分支，用 old 分支名会 clone 失败。
#
# 框架基于 breeze303/openwrt-ci 的 IPQ60XX-6.12-NOWIFI 工作流
# ============================================================================

on:
  # 只保留手动触发：GitHub 免费额度有限，编译一次 3-5 小时
  workflow_dispatch:
    inputs:
      release:
        description: '是否发布到 Releases'
        required: false
        default: 'true'
  # 需要定时编译时再取消注释（注意 cron 是 UTC，北京时间要减 8 小时）
  # schedule:
  #   - cron: '0 19 * * *'

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/zn-m2.config
  DIY_SCRIPT: diy-zn-m2.sh

  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: ZN-M2-OpenClash
  TZ: Asia/Shanghai

jobs:
  Build:
    # 用 22.04：OpenWrt 官方 CI 与 ImmortalWrt 文档均以 22.04 为准，最稳
    runs-on: ubuntu-22.04

    steps:
    # ------------------------------------------------------------------
    - name: 检查服务器性能
      run: |
        echo "--------------------------CPU--------------------------"
        echo -e "$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
        echo "--------------------------内存--------------------------"
        echo -e "$(sudo lshw -short -C memory | grep GiB)"
        echo "--------------------------磁盘--------------------------"
        df -hT

    # ------------------------------------------------------------------
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix
        sudo -E apt -yqq install libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    # ------------------------------------------------------------------
    # 扩磁盘：runner 默认约 14GB 可用，OpenWrt 全量编不下
    # 必须在 clone 之前执行
    - name: 合并磁盘扩容
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: 拉取仓库
      uses: actions/checkout@main

    # ------------------------------------------------------------------
    - name: 克隆源码
      run: |
        df -hT $GITHUB_WORKSPACE
        echo ">>> 源码: $REPO_URL"
        echo ">>> 分支: $REPO_BRANCH"
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "=== 源码最新提交 ==="
        git log -1 --date=short --format="%cd  %h  %s"
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        echo "=== 内核版本 ==="
        ls target/linux/generic/ | grep kernel-
        VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.12 || echo '6.12.x')
        echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV

    # ------------------------------------------------------------------
    - name: 生成变量
      run: |
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | awk -F '"' '{print $2}')
        DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "目标平台: $DEVICE_TARGET / $DEVICE_SUBTARGET"

    # ------------------------------------------------------------------
    - name: 缓存工具链
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    # ------------------------------------------------------------------
    - name: 安装 feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ------------------------------------------------------------------
    # 这一步做两件事：
    #   1. 重新覆盖 .config（因为上一步 defconfig 时 OpenClash 包还不存在，
    #      配置项会被 defconfig 丢弃，这里必须重新写入）
    #   2. 执行 DIY 脚本：克隆 OpenClash 包体 + 预置 mihomo 内核
    # 顺序不能颠倒，否则 .config 里的 openclash=y 会失效
    - name: 加载自定义配置并执行 DIY
      run: |
        [ -e files ] && cp -r files $OPENWRT_PATH/files
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        bash $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: 下载依赖包
      run: |
        cd $OPENWRT_PATH
        make defconfig
        echo "================================"
        echo "  配置校验：OpenClash 是否保留"
        echo "================================"
        grep -i "openclash" .config || echo "!!! 警告: .config 中未找到 openclash，包可能不会被编译"
        grep -i "homeproxy" .config || echo "  (homeproxy 未选中)"
        echo "================================"
        echo "  包目录校验"
        echo "================================"
        ls -d package/luci-app-openclash 2>/dev/null && echo "  ✓ OpenClash 包目录存在" || echo "  ✗ OpenClash 包目录缺失"
        ls -la files/etc/openclash/core/ 2>/dev/null || echo "  (内核目录为空，刷后需手动更新内核)"
        echo "================================"
        make download -j8
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    # ------------------------------------------------------------------
    - name: 编译固件
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) 线程编译"
        # 三层降级：多线程 → 单线程 → 单线程详细日志
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

    - name: 检查磁盘占用
      if: (!cancelled())
      run: df -hT

    # ------------------------------------------------------------------
    - name: 整理产物
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums || true
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \; | head -1)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages 2>/dev/null || true
        tar -zcf Packages.tar.gz packages 2>/dev/null || true
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "=== 产物清单 ==="
        ls -lh
        echo "=== 确认 zn_m2 固件 ==="
        ls -lh *zn_m2* || echo "!! 未找到 zn_m2 固件"

    - name: 上传到 Artifacts
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: 发布到 Releases
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **兆能 M2 (ZN M2) OpenWrt 固件 —— 无 WiFi + NSS + OpenClash**

          ### 固件信息
          - 设备：兆能 M2 / 高通 IPQ6000 / 4×Cortex-A53
          - 内核：${{ env.VERSION_KERNEL }}（带有线 NSS 硬件加速）
          - WiFi：不含（ath11k 已剔除）
          - 集成：**OpenClash**（含 mihomo 内核）+ HomeProxy + sing-box
          - 源码：${{ env.REPO_URL }}
          - 分支：${{ env.REPO_BRANCH }}
          - 默认地址：192.168.12.1
          - 默认用户：root
          - 默认密码：password

          ### 刷机提醒
          - 刷机方式：暗云 U-Boot 网页 → **只点「固件」入口**
          - 用 `*nand-factory.ubi` 刷写
          - 扩容机刷前务必备份 CDT（mtd10 / mtd11）

          ### 源码更新记录
          ${{ env.VERSION_INFO }}
